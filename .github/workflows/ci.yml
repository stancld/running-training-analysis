name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (lint, format, ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv lock --check
      - run: uv sync --locked
      # The author-email hook guards local commits; CI has no author identity.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: enforce-personal-email

  smoke:
    name: tl e2e and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
      - run: scripts/synthetic_cache.sh
      - name: Run every command
        run: |
          uv run tl
          uv run tl weeks all > /dev/null
          uv run tl months all > /dev/null
          for c in seasons hills segments reps; do uv run tl "$c" > /dev/null; done
          uv run tl export "$RUNNER_TEMP/diary.json"
          uv run tl site "$RUNNER_TEMP/payload.json"
      - run: uv build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - run: uv sync --locked
      # The synthetic cache through `tl site` into the built page, so the payload contract is tested too.
      - run: scripts/synthetic_cache.sh
      - run: uv run tl site
      - working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run build
          bunx playwright test

  build:
    name: build page (committed payload)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
