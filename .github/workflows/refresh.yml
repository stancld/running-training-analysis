name: Refresh training data

on:
  schedule:
    # 07:23 Prague in winter, 08:23 in summer; ingest completed local days only.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Share the lock with manual payload-push deployments. Never cancel a token write.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master' && vars.TRAINING_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - run: uv sync --locked
      - name: Restore private checkpoint (missing state is fatal)
        run: uv run python scripts/fetch_zones.py --restore
        env:
          GH_TOKEN: ${{ secrets.TRAINING_STATE_TOKEN }}
          TRAINING_STATE_KEY: ${{ secrets.TRAINING_STATE_KEY }}
      - name: Fetch missing activities and checkpoint rotated token
        run: uv run python scripts/fetch_zones.py --refresh
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.TRAINING_STATE_TOKEN }}
          TRAINING_STATE_KEY: ${{ secrets.TRAINING_STATE_KEY }}
      - name: Validate and persist successful ingestion
        run: |
          set -euo pipefail
          uv run tl site
          uv run python scripts/fetch_zones.py --save
        env:
          GH_TOKEN: ${{ secrets.TRAINING_STATE_TOKEN }}
          TRAINING_STATE_KEY: ${{ secrets.TRAINING_STATE_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Reject a stale page if master advanced
        run: |
          git fetch --quiet origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      # Only the public site is uploaded, never data/ or the token checkpoint.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - name: Remove private runner files
        if: always()
        run: |
          rm -f "$HOME/.config/tl/strava_refresh_token" "$HOME/.config/tl/state_head.json"
          rm -f data/*.csv data/strava_sync.json
