services:
  diary:
    # Full bundle mode: one script instead of ~20 modules in a 5-deep import waterfall,
    # which is what makes the portal slow over a high-latency link. Builds are unaffected.
    command: cd web && bun install --frozen-lockfile && exec bun run dev --host 0.0.0.0 --port "$PORT" --strictPort --experimentalBundle
    health: /
    portal:
      url: /
      title: Training logbook
      description: Vite dev server for web/; `uv run tl site` rewrites the payload and the page hot-reloads.
